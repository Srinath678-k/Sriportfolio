<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>
    <linearGradient id="smGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe3a0" />
      <stop offset="50%" stop-color="#f2b636" />
      <stop offset="100%" stop-color="#b9791a" />
    </linearGradient>
    <linearGradient id="smCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c2e" />
      <stop offset="100%" stop-color="#0d111d" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#smBg)" />

  <!-- Navbar Mockup -->
  <rect x="0" y="0" width="800" height="60" fill="#0b0f19" opacity="0.9" />
  <circle cx="35" cy="30" r="12" fill="url(#smGold)" />
  <text x="56" y="36" font-family="'Anton', sans-serif" font-size="20" fill="#ffffff" letter-spacing="1">SRI<tspan fill="#f2b636">MART</tspan></text>
  
  <rect x="230" y="18" width="340" height="26" rx="13" fill="#151b2b" stroke="#2a3348" stroke-width="1" />
  <text x="250" y="35" font-family="'Manrope', sans-serif" font-size="11" fill="#717d96">Search products, electronics, tech gear...</text>

  <rect x="680" y="18" width="90" height="26" rx="6" fill="url(#smGold)" />
  <text x="704" y="35" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#06070b">CART (3)</text>

  <!-- Hero Banner -->
  <g transform="translate(40, 85)">
    <rect width="720" height="175" rx="16" fill="url(#smCard)" stroke="#222b40" stroke-width="1" />
    <circle cx="580" cy="87" r="95" fill="#f2b636" opacity="0.12" filter="blur(30px)" />
    
    <text x="40" y="55" font-family="'Anton', sans-serif" font-size="34" fill="#ffffff" letter-spacing="1">NEXT-GEN TECH &amp; APPAREL</text>
    <text x="40" y="85" font-family="'Manrope', sans-serif" font-size="13" fill="#9ea4b5">Exclusive Deals on Handcrafted Essentials. Fast Delivery across India.</text>
    
    <rect x="40" y="110" width="130" height="36" rx="8" fill="url(#smGold)" />
    <text x="62" y="133" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#06070b">SHOP NOW →</text>

    <!-- Graphic / Device Illustration inside Hero -->
    <g transform="translate(520, 20)">
      <rect x="0" y="0" width="140" height="135" rx="12" fill="#1d243b" stroke="url(#smGold)" stroke-width="1.5" />
      <circle cx="70" cy="55" r="30" fill="#2a3454" />
      <path d="M 55 55 L 85 55 M 70 40 L 70 70" stroke="#f2b636" stroke-width="3" stroke-linecap="round" />
      <rect x="25" y="100" width="90" height="12" rx="6" fill="#f2b636" opacity="0.4" />
    </g>
  </g>

  <!-- Product Grid Cards -->
  <g transform="translate(40, 280)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="185" rx="12" fill="url(#smCard)" stroke="#222b40" stroke-width="1" />
      <rect x="15" y="15" width="190" height="95" rx="8" fill="#131726" />
      <circle cx="110" cy="62" r="28" fill="#1f273d" />
      <text x="15" y="132" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Aura Wireless Pro</text>
      <text x="15" y="152" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#f2b636">₹ 4,999</text>
      <rect x="150" y="134" width="55" height="24" rx="6" fill="#1e263d" stroke="#f2b636" stroke-width="1" />
      <text x="163" y="150" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#f2b636">+ ADD</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(250, 0)">
      <rect width="220" height="185" rx="12" fill="url(#smCard)" stroke="#222b40" stroke-width="1" />
      <rect x="15" y="15" width="190" height="95" rx="8" fill="#131726" />
      <circle cx="110" cy="62" r="28" fill="#1f273d" />
      <text x="15" y="132" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Titan Smartwatch X</text>
      <text x="15" y="152" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#f2b636">₹ 8,499</text>
      <rect x="150" y="134" width="55" height="24" rx="6" fill="#1e263d" stroke="#f2b636" stroke-width="1" />
      <text x="163" y="150" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#f2b636">+ ADD</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(500, 0)">
      <rect width="220" height="185" rx="12" fill="url(#smCard)" stroke="#222b40" stroke-width="1" />
      <rect x="15" y="15" width="190" height="95" rx="8" fill="#131726" />
      <circle cx="110" cy="62" r="28" fill="#1f273d" />
      <text x="15" y="132" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mechanical Keypad</text>
      <text x="15" y="152" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#f2b636">₹ 3,299</text>
      <rect x="150" y="134" width="55" height="24" rx="6" fill="#1e263d" stroke="#f2b636" stroke-width="1" />
      <text x="163" y="150" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#f2b636">+ ADD</text>
    </g>
  </g>
</svg>
