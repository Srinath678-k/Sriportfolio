<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Crop Images</title>
</head>
<body>
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<canvas id="c3"></canvas>
<script>
async function processImage(src, cropTopPct, cropBottomPct, canvasId, outputName) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = src;
    img.onload = () => {
      const topCrop = img.height * cropTopPct;
      const bottomCrop = img.height * cropBottomPct;
      const cropHeight = img.height - topCrop - bottomCrop;
      const cropWidth = img.width;

      const canvas = document.getElementById(canvasId);
      canvas.width = cropWidth;
      canvas.height = cropHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, topCrop, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      console.log('DONE_' + outputName + ':' + dataUrl.substring(0, 50));
      window[outputName] = dataUrl;
      resolve(dataUrl);
    };
  });
}

async function run() {
  await processImage('assets/thumbs/media-01.jpg', 0.11, 0.20, 'c1', 'img1');
  await processImage('assets/thumbs/media-02.jpg', 0.12, 0.18, 'c2', 'img2');
  await processImage('assets/thumbs/media-03.jpg', 0.10, 0.23, 'c3', 'img3');
  document.body.setAttribute('data-ready', 'true');
}
run();
</script>
</body>
</html>
